[project]
name = "gitproject"
version = "0.1.0"
description = "Unified Python 3.12 environment for projects under C:\\codes"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "albumentations==2.0.8",
    "beautifulsoup4>=4.15.0",
    "catboost>=1.2.10",
    "certifi>=2026.7.22",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "folium>=0.20.0",
    "google-genai>=2.20.0",
    "google-generativeai>=0.8.6",
    "imbalanced-learn>=0.14.2",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    "lightgbm>=4.7.0",
    "matplotlib==3.11.1",
    "missingno>=0.5.2",
    "numpy==2.5.2",
    "opencv-python==5.0.0.93",
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "pandas==3.0.5",
    "pillow==12.3.0",
    "plotly>=6.9.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "pytz>=2026.2",
    "requests>=2.34.2",
    "scikit-image==0.26.0",
    "scikit-learn==1.9.0",
    "scipy>=1.18.1",
    "seaborn==0.13.2",
    "selenium>=4.46.0",
    "shap>=0.52.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.62.0",
    "streamlit-folium>=0.27.4",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchsummary==1.5.1",
    "torchvision==0.28.0",
    "tqdm==4.70.0",
    "uvicorn>=0.52.4",
    "webdriver-manager>=4.1.2",
    "xgboost>=3.4.1",
    "xmltodict>=1.0.4",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
